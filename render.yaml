services:
  - type: web
    name: ploi-panel
    runtime: docker
    plan: starter
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ploi-panel-db
          property: connectionString
      - key: APP_KEY
        generateValue: true
      - key: PLOI_TOKEN
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: ploi-panel-db
    plan: starter
    databaseName: ploi_panel
    user: ploi_panel
